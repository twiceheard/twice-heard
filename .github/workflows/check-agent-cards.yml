name: Check agent cards

# pull_request_target: this workflow file, the checker and the schema always come
# from the base branch, so a pull request cannot change how it is judged.
# Nothing from the pull request is checked out or executed: its commits are only
# fetched, and the checker reads the diff and the card files with git as data.
# github.sha is the current tip of the base branch (pull_request.base.sha can be
# stale on an old or reopened PR, and would run outdated scripts).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pull request commits (data only)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate changed files
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-agent-cards.mjs

  # Once the check passed, if the author registered those agents on the hub (same GitHub user id),
  # commits the card files to the base branch and closes the PR (see merge-agent-cards.mjs for why
  # not a merge). Otherwise the PR stays open for a maintainer. Same rules as above: code from the
  # base branch only, the PR is read as data, the token is given to that one step only.
  merge:
    needs: check
    if: github.event.pull_request.draft == false && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pull request commits (data only)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accept the cards if the agents are registered
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/merge-agent-cards.mjs
